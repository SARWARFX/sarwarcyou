name: Generate Single-Frame Video Thumbnails (30% WebP)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [vault_upload]
  schedule:
    # Runs automatically once every 24 hours at 00:00 UTC (06:00 AM BD time)
    - cron: '0 0 * * *'

jobs:
  generate-thumbnails:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install huggingface_hub

      - name: Run Single-Frame 30% WebP Thumbnail Pipeline
        id: thumbnail_step
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import json
          import subprocess
          import urllib.parse
          from huggingface_hub import HfApi, list_repo_files, hf_hub_download

          hf_token = os.environ.get("HF_TOKEN")
          if not hf_token:
              print("WARNING: HF_TOKEN secret is not set! Dataset operations might fail.")

          api = HfApi(token=hf_token)
          REPO_ID = "SARWARFX/stream-vault"
          LOCAL_THUMB_DIR = "./temp_thumbnails"
          os.makedirs(LOCAL_THUMB_DIR, exist_ok=True)

          print(f"Fetching current file manifest from {REPO_ID}...")
          all_files = list_repo_files(repo_id=REPO_ID, repo_type="dataset", token=hf_token)
          existing_files_set = set(all_files)

          video_files = [
              f for f in all_files 
              if f.lower().endswith(('.mp4', '.mov', '.webm', '.mkv', '.avi'))
              and not f.lower().startswith(('thumbnails/', '.thumbnails/'))
          ]

          print(f"Total video files found in vault: {len(video_files)}")

          # Load existing thumbnails manifest if present
          manifest = {}
          if os.path.exists("public/thumbnails.json"):
              try:
                  with open("public/thumbnails.json", "r", encoding="utf-8") as mf:
                      manifest = json.load(mf)
                  print(f"Loaded existing manifest with {len(manifest)} items from public/thumbnails.json")
              except Exception as e:
                  print(f"Note: Could not parse local manifest: {e}")
          elif "thumbnails.json" in existing_files_set:
              try:
                  manifest_path = hf_hub_download(repo_id=REPO_ID, filename="thumbnails.json", repo_type="dataset", token=hf_token)
                  with open(manifest_path, "r", encoding="utf-8") as mf:
                      manifest = json.load(mf)
                  print(f"Loaded existing manifest with {len(manifest)} items from Hugging Face dataset")
              except Exception as e:
                  print(f"Note: Could not load remote manifest: {e}")

          def get_duration(url, token):
              quoted_path = urllib.parse.quote(url, safe=":/")
              cmd = [
                  "ffprobe", "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1"
              ]
              if token:
                  cmd.extend(["-headers", f"Authorization: Bearer {token}\r\n"])
              cmd.append(quoted_path)

              res = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              try:
                  val = float(res.stdout.strip())
                  return val if val > 0 else None
              except Exception:
                  print(f"  [Probe Warning] Could not probe {url}: {res.stderr.strip()[:150]}")
                  return None

          generated_count = 0

          for idx, v in enumerate(video_files, 1):
              base_name = os.path.splitext(v)[0]
              thumb_rel_path = f"Thumbnails/{base_name}.webp"
              dest_path = os.path.join(LOCAL_THUMB_DIR, thumb_rel_path)

              # Incremental processing check: skip if thumbnail already exists in HF dataset or local destination
              if thumb_rel_path in existing_files_set or os.path.exists(dest_path):
                  manifest[v] = thumb_rel_path
                  print(f"[{idx}/{len(video_files)}] [SKIP] Thumbnail already exists: {thumb_rel_path}")
                  continue

              print(f"[{idx}/{len(video_files)}] [PROCESSING] Capturing 30% frame for: {v}")

              # Safely quote file path for URL resolution
              quoted_v = urllib.parse.quote(v, safe="/")
              video_url = f"https://huggingface.co/datasets/{REPO_ID}/resolve/main/{quoted_v}"

              duration = get_duration(video_url, hf_token)
              if not duration or duration <= 0:
                  print(f"  -> Using 10.0s fallback duration for {v}")
                  duration = 10.0

              # Exactly 30% duration target
              seek_time = max(0.5, round(duration * 0.30, 2))
              os.makedirs(os.path.dirname(dest_path), exist_ok=True)

              cmd = [
                  "ffmpeg", "-y"
              ]
              if hf_token:
                  cmd.extend(["-headers", f"Authorization: Bearer {hf_token}\r\n"])

              cmd.extend([
                  "-ss", str(seek_time),
                  "-i", video_url,
                  "-frames:v", "1",
                  "-vf", "scale='min(640,iw)':-2",
                  "-c:v", "libwebp",
                  "-quality", "80",
                  dest_path
              ])

              res = subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
              if res.returncode == 0 and os.path.exists(dest_path) and os.path.getsize(dest_path) > 0:
                  generated_count += 1
                  manifest[v] = thumb_rel_path
                  print(f"  [SUCCESS] Generated WebP ({os.path.getsize(dest_path)} B) @ {seek_time}s: {thumb_rel_path}")
              else:
                  print(f"  [FFmpeg Error] Capture failed for {v}: {res.stderr.strip()[:150]}")

          print(f"\nFinished extraction. Total new thumbnails generated: {generated_count}")

          # Write updated manifest to temp thumb dir (for dataset upload) and public/ & src/data/ (for app)
          manifest_temp_path = os.path.join(LOCAL_THUMB_DIR, "thumbnails.json")
          with open(manifest_temp_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)

          os.makedirs("public", exist_ok=True)
          with open("public/thumbnails.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)

          os.makedirs("src/data", exist_ok=True)
          with open("src/data/thumbnails.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"generated_count={generated_count}\n")

          if generated_count > 0:
              print(f"Committing and uploading generated thumbnails to {REPO_ID} (single atomic commit)...")
              api.upload_folder(
                  folder_path=LOCAL_THUMB_DIR,
                  repo_id=REPO_ID,
                  repo_type="dataset",
                  commit_message=f"feat(thumbnails): generate {generated_count} single-frame 30% WebP thumbnails (quality 80, 640px max)"
              )
              print("Dataset upload complete!")
          else:
              print("Hugging Face dataset repository is completely up-to-date. No new uploads needed.")
          EOF

      - name: Commit Updated Thumbnails Manifest to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/thumbnails.json src/data/thumbnails.json
          git diff --staged --quiet || (git commit -m "chore(manifest): update thumbnails.json [skip ci]" && git push origin main)

      - name: Purge Cloudflare Cache
        if: steps.thumbnail_step.outputs.generated_count != '0' && env.CLOUDFLARE_ZONE_ID != ''
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "New thumbnails uploaded, triggering Cloudflare Cache Purge..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
               -H "Content-Type: application/json" \
               --data '{"purge_everything":true}' | grep -o '"success":true' || echo "Cache purge finished."

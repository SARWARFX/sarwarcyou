name: Clean Old Thumbnails

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install huggingface_hub

      - name: Delete old thumbnails on HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          from huggingface_hub import HfApi, list_repo_files, CommitOperationDelete

          hf_token = os.environ.get("HF_TOKEN")
          api = HfApi(token=hf_token)
          REPO_ID = "SARWARFX/stream-vault"

          all_files = list_repo_files(repo_id=REPO_ID, repo_type="dataset", token=hf_token)
          thumb_files = [f for f in all_files if f.startswith("thumbnails/")]

          print(f"Found {len(thumb_files)} old thumbnail files to delete.")

          if thumb_files:
              operations = [CommitOperationDelete(path_in_repo=f) for f in thumb_files]
              api.create_commit(
                  repo_id=REPO_ID,
                  repo_type="dataset",
                  operations=operations,
                  commit_message="Wipe old thumbnails directory"
              )
              print("Successfully deleted all old thumbnails in a single commit!")
          else:
              print("No thumbnails found to delete.")
          EOF

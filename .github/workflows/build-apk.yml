name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Compile Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk StreamVault.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-Android-APK
          path: StreamVault.apk
          retention-days: 30

      - name: Publish or Update GitHub Release (Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "StreamVault Android App (Latest Build)"
          body: |
            ### 📱 StreamVault Android App (Direct Download)

            - **File:** `StreamVault.apk`
            - **Direct Download Link:** [Download StreamVault.apk](https://github.com/${{ github.repository }}/releases/download/apk-latest/StreamVault.apk)
            - **Commit:** ${{ github.sha }}

            #### Installation on your Android phone:
            1. Tap the download link above on your phone's browser.
            2. When the download finishes, tap **Open**.
            3. If prompted, allow "Install from unknown sources" (or "Install unknown apps" for Chrome/browser).
            4. Tap **Install** and enjoy StreamVault natively!
          files: |
            StreamVault.apk

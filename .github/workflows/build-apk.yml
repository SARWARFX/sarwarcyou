name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Build & Sign Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}" --no-daemon
          cd ..
        env:
          CI: true
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release Asset
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk SARWARCYOU-v${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk SARWARCYOU.apk
          cp android/app/build/outputs/apk/release/app-release.apk StreamVault.apk

      - name: Clean Keystore
        if: always()
        run: rm -f android/app/release-key.jks

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARWARCYOU-v${{ github.run_number }}
          path: SARWARCYOU-v${{ github.run_number }}.apk
          retention-days: 30

      - name: Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "SARWARCYOU v1.0.${{ github.run_number }}"
          body: |
            ### 📱 SARWARCYOU v1.0.${{ github.run_number }} (Direct Download)

            - **Version:** `1.0.${{ github.run_number }}` (versionCode: `${{ github.run_number }}`)
            - **Primary Signed APK:** [`SARWARCYOU-v${{ github.run_number }}.apk`](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/SARWARCYOU-v${{ github.run_number }}.apk)
            - **Commit:** ${{ github.sha }}

            #### Installation on your Android phone:
            1. Tap the download link above on your phone's browser.
            2. When the download finishes, tap **Open**.
            3. If prompted, allow "Install from unknown sources" (or "Install unknown apps").
            4. Tap **Install** / **Update** and launch SARWARCYOU!
          files: |
            SARWARCYOU-v${{ github.run_number }}.apk
            SARWARCYOU.apk
            StreamVault.apk

      - name: Update Latest Release Tag (apk-latest)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "SARWARCYOU Android App (Latest Build)"
          body: |
            ### 📱 SARWARCYOU Android App (Latest Build)

            - **Latest Version:** `1.0.${{ github.run_number }}` (versionCode: `${{ github.run_number }}`)
            - **Direct Download Link:** [Download SARWARCYOU.apk](https://github.com/${{ github.repository }}/releases/download/apk-latest/SARWARCYOU.apk)
            - **Legacy Link:** [Download StreamVault.apk](https://github.com/${{ github.repository }}/releases/download/apk-latest/StreamVault.apk)
            - **Commit:** ${{ github.sha }}
          files: |
            SARWARCYOU-v${{ github.run_number }}.apk
            SARWARCYOU.apk
            StreamVault.apk

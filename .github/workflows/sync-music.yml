name: Daily Actress YouTube Music Releases Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    name: Sync Actress YouTube Music
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm install rss-parser
      - name: Run Music Sync Script
        run: node scripts/sync-music-daily.mjs
      - name: Commit & Push Latest Music Releases
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/latestMusicReleases.json
          git commit -m "chore(music): sync latest verified actress music video releases" || exit 0
          git push

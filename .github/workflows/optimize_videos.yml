import os
from huggingface_hub import HfApi

api = HfApi(token=os.environ.get("HF_TOKEN"))
REPO_ID = "SARWARFX/stream-vault"
LOCAL_OUTPUT_DIR = "./optimized_output"

# 1. After your FFmpeg loop finishes saving all 75 videos into LOCAL_OUTPUT_DIR:
print(f"Uploading entire batch to {REPO_ID} in a single commit...")

api.upload_folder(
    folder_path=LOCAL_OUTPUT_DIR,
    repo_id=REPO_ID,
    repo_type="dataset",
    commit_message="Batch video optimization (bulk upload)"
)

# 2. Upload the updated manifest file
api.upload_file(
    path_or_fileobj=".optimized_manifest.json",
    path_in_repo=".optimized_manifest.json",
    repo_id=REPO_ID,
    repo_type="dataset",
    commit_message="Update .optimized_manifest.json"
)

print("Batch successfully uploaded using only 2 commits!")

name: Daily Celebrity Intel Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Every day at 02:00 UTC (08:00 AM BST)

permissions:
  contents: write

jobs:
  sync:
    name: Daily Celebrity Intel Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Feed Parsers
        run: npm install rss-parser
      - name: Run Daily Sync Script
        run: node scripts/sync-celebrity-daily.mjs
      - name: Commit & Push Daily Intel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/celebrityGallery.json src/data/celebrityNews.json
          git commit -m "chore(feed): daily sync of verified celebrity wallpapers and news" || exit 0
          git push

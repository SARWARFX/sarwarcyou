<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="fav-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="fav-bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="fav-play-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#60a5fa"/>
      <stop offset="65%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Plate -->
  <rect width="100" height="100" rx="24" fill="#030305"/>
  <rect width="94" height="94" x="3" y="3" rx="21" fill="url(#fav-bg-glow)"/>
  <rect width="94" height="94" x="3" y="3" rx="21" fill="none" stroke="url(#fav-border-grad)" stroke-width="2"/>
  
  <!-- Glowing Cyber Play Button Icon -->
  <path
    d="M38 27 C38 24.5 40.8 23 43 24.3 L73 46.5 C75 48 75 51 73 52.5 L43 74.7 C40.8 76 38 74.5 38 72 Z"
    fill="url(#fav-play-grad)"
    filter="url(#glow)"
  />
</svg>
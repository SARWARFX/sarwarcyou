<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SARWAR.CYOU — Graph Design Showcase (Desktop & Phone)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-black: #000000;
      --card-bg: rgba(10, 10, 10, 0.95);
      --accent-lime: #00f0ff;
      --accent-lime-dim: rgba(0, 240, 255, 0.15);
      --accent-lime-glow: rgba(0, 240, 255, 0.5);
      --font-orbitron: 'Orbitron', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-inter: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-black);
      color: #ffffff;
      font-family: var(--font-inter);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 80px;
      overflow-x: hidden;
    }

    /* Top Navigation / Controls Bar */
    .top-controls {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-text {
      font-family: var(--font-orbitron);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #ffffff;
    }

    .brand-text span {
      color: var(--accent-lime);
      text-shadow: 0 0 12px var(--accent-lime-glow);
    }

    .design-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .design-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.6);
      font-family: var(--font-orbitron);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 8px 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      color: #ffffff;
      border-color: rgba(0, 240, 255, 0.4);
    }

    .tab-btn.active {
      color: #000000;
      background: var(--accent-lime);
      border-color: var(--accent-lime);
      box-shadow: 0 0 16px var(--accent-lime-glow);
      font-weight: 900;
    }

    .device-toggles {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .device-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.5);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .device-btn.active {
      color: var(--accent-lime);
      border-color: var(--accent-lime);
      background: rgba(0, 240, 255, 0.1);
    }

    /* Main Showcase Canvas */
    .showcase-stage {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
      transition: all 0.35s ease;
    }

    .showcase-stage.phone-view {
      max-width: 380px;
    }

    /* Shared Modal Card Container */
    .graph-card-wrapper {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 28px 24px 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.95), 0 0 40px rgba(0, 240, 255, 0.12);
      position: relative;
      transition: all 0.3s ease;
    }

    .graph-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .graph-concept-badge {
      font-family: var(--font-orbitron);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: var(--accent-lime);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .concept-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-lime);
      box-shadow: 0 0 8px var(--accent-lime);
    }

    .close-icon-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 22px;
      cursor: pointer;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    /* ========================================================================= */
    /* DESIGN 1: CYBER MONOLITH PILLARS (SEGMENTED LED EQUALIZER)               */
    /* ========================================================================= */
    .d1-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      height: 220px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .d1-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      flex: 1;
      min-width: 38px;
      gap: 8px;
    }

    .d1-segments-track {
      width: 100%;
      max-width: 20px;
      height: 140px;
      display: flex;
      flex-direction: column-reverse;
      gap: 3px;
    }

    .d1-segment {
      width: 100%;
      height: 5px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.06);
      transition: all 0.3s ease;
    }

    .d1-segment.lit {
      background: var(--accent-lime);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    .d1-segment.lit-peak {
      background: #ffffff;
      box-shadow: 0 0 10px #ffffff;
    }

    /* ========================================================================= */
    /* DESIGN 2: QUANTUM PULSE / NEON OSCILLOSCOPE WAVE                          */
    /* ========================================================================= */
    .d2-chart {
      height: 220px;
      position: relative;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .d2-svg-wrap {
      width: 100%;
      height: 160px;
    }

    .d2-labels-row {
      display: flex;
      justify-content: space-between;
      padding-top: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .d2-day-label {
      font-family: var(--font-orbitron);
      font-size: 9.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      flex: 1;
      min-width: 36px;
    }

    .d2-day-label.is-today {
      color: var(--accent-lime);
      font-weight: 900;
    }

    /* ========================================================================= */
    /* DESIGN 3: ROUNDED GLASS MICRO-PILLS (CYLINDRICAL STEMS)                   */
    /* ========================================================================= */
    .d3-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      height: 220px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .d3-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      flex: 1;
      min-width: 38px;
      gap: 8px;
    }

    .d3-pill-outer {
      width: 100%;
      max-width: 14px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      height: 140px;
      display: flex;
      align-items: flex-end;
      padding: 2px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .d3-pill-fill {
      width: 100%;
      background: linear-gradient(to top, #0088aa, var(--accent-lime));
      border-radius: 12px;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.5);
      transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ========================================================================= */
    /* DESIGN 4: ADAPTIVE DUAL-MODE                                              */
    /* HORIZONTAL TRACK RAILS ON PHONE / WIDE STEMS ON DESKTOP                   */
    /* ========================================================================= */
    .d4-desktop-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      height: 220px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }

    .d4-phone-chart {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      scrollbar-width: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }

    .d4-rail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .d4-rail-day {
      width: 58px;
      font-family: var(--font-orbitron);
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
    }

    .d4-rail-day.is-today {
      color: var(--accent-lime);
      font-weight: 900;
    }

    .d4-rail-bar-track {
      flex: 1;
      height: 10px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 1px;
    }

    .d4-rail-fill {
      height: 100%;
      background: linear-gradient(to right, #0088aa, var(--accent-lime));
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .d4-rail-time {
      width: 48px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: #ffffff;
      text-align: right;
    }

    /* Common Typography & Footer */
    .chart-time-val {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
      white-space: nowrap;
    }

    .chart-day-label {
      font-family: var(--font-orbitron);
      font-size: 9.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .is-today .chart-day-label {
      color: var(--accent-lime);
      font-weight: 900;
    }

    /* Footer: Keep Screen On */
    .graph-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      padding-top: 2px;
    }

    .keep-screen-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      transition: background 0.25s ease;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-radius: 50%;
      transition: transform 0.25s ease;
    }

    .toggle-switch.active {
      background: var(--accent-lime);
    }

    .toggle-switch.active::after {
      transform: translateX(16px);
      background: #000000;
    }

    .keep-screen-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.05em;
    }

    .esc-hint {
      font-family: var(--font-mono);
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <!-- Top Controller -->
  <header class="top-controls">
    <div class="brand-title">
      <div class="brand-text">SARWAR<span>.CYOU</span> // GRAPH LAB</div>
      <div class="device-toggles">
        <button class="device-btn active" id="btnWide" onclick="setDeviceView('wide')">DESKTOP WIDE</button>
        <button class="device-btn" id="btnPhone" onclick="setDeviceView('phone')">PHONE FRAME (380px)</button>
      </div>
    </div>

    <!-- 4 Design Concepts Selector -->
    <div class="design-tabs">
      <button class="tab-btn active" id="tabD1" onclick="switchConcept(1)">1. CYBER MONOLITH PILLARS</button>
      <button class="tab-btn" id="tabD2" onclick="switchConcept(2)">2. QUANTUM PULSE WAVE</button>
      <button class="tab-btn" id="tabD3" onclick="switchConcept(3)">3. ROUNDED GLASS MICRO-PILLS</button>
      <button class="tab-btn" id="tabD4" onclick="switchConcept(4)">4. ADAPTIVE HORIZONTAL RAILS</button>
    </div>
  </header>

  <!-- Showcase Stage -->
  <main class="showcase-stage" id="showcaseStage">
    <div class="graph-card-wrapper" id="graphCard">
      
      <!-- Modal Header -->
      <div class="graph-header-row">
        <div class="graph-concept-badge">
          <span class="concept-dot"></span>
          <span id="conceptTitle">1. CYBER MONOLITH PILLARS (EQUALIZER TOWERS)</span>
        </div>
      </div>

      <!-- Chart Content Injected Dynamically -->
      <div id="chartContainer"></div>

      <!-- Minimalist Footer -->
      <div class="graph-footer-row">
        <label class="keep-screen-wrap" onclick="toggleScreen()">
          <span class="toggle-switch" id="screenSwitch"></span>
          <span class="keep-screen-label">Keep Screen On</span>
        </label>
      </div>

    </div>
  </main>

  <script>
    // 15-day mock telemetry where zero-minute days are suppressed
    const activeTelemetryData = [
      { label: 'Today', minutes: 75, formatted: '1h 15m' },
      { label: 'Yestd', minutes: 42, formatted: '42m' },
      { label: 'Thu', minutes: 130, formatted: '2h 10m' },
      { label: 'Wed', minutes: 95, formatted: '1h 35m' },
      { label: 'Mon', minutes: 54, formatted: '54m' },
      { label: 'Sat', minutes: 165, formatted: '2h 45m' },
      { label: 'Fri', minutes: 82, formatted: '1h 22m' },
      { label: 'Wed', minutes: 38, formatted: '38m' },
      { label: 'Tue', minutes: 110, formatted: '1h 50m' },
      { label: 'Sun', minutes: 64, formatted: '1h 4m' }
    ];

    const maxMinutes = 165;
    let activeConcept = 1;
    let currentDevice = 'wide';

    function setDeviceView(mode) {
      currentDevice = mode;
      const stage = document.getElementById('showcaseStage');
      const btnWide = document.getElementById('btnWide');
      const btnPhone = document.getElementById('btnPhone');

      if (mode === 'phone') {
        stage.classList.add('phone-view');
        btnPhone.classList.add('active');
        btnWide.classList.remove('active');
      } else {
        stage.classList.remove('phone-view');
        btnWide.classList.add('active');
        btnPhone.classList.remove('active');
      }

      renderCurrentConcept();
    }

    function switchConcept(id) {
      activeConcept = id;
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`tabD${i}`).classList.toggle('active', i === id);
      }
      renderCurrentConcept();
    }

    function renderCurrentConcept() {
      const container = document.getElementById('chartContainer');
      const title = document.getElementById('conceptTitle');
      container.innerHTML = '';

      if (activeConcept === 1) {
        title.textContent = '1. CYBER MONOLITH PILLARS (SEGMENTED EQUALIZER)';
        renderConcept1(container);
      } else if (activeConcept === 2) {
        title.textContent = '2. QUANTUM PULSE (NEON WAVE OSCILLOSCOPE)';
        renderConcept2(container);
      } else if (activeConcept === 3) {
        title.textContent = '3. ROUNDED GLASS MICRO-PILLS (CYLINDRICAL CAPSULES)';
        renderConcept3(container);
      } else if (activeConcept === 4) {
        title.textContent = currentDevice === 'phone' 
          ? '4. ADAPTIVE HORIZONTAL RAILS (PHONE OPTIMIZED)' 
          : '4. ADAPTIVE DUAL-MODE (DESKTOP VIEW)';
        renderConcept4(container);
      }
    }

    // CONCEPT 1: Segmented Equalizer Pillars
    function renderConcept1(parent) {
      const chart = document.createElement('div');
      chart.className = 'd1-chart';

      activeTelemetryData.forEach(item => {
        const col = document.createElement('div');
        col.className = 'd1-column' + (item.label === 'Today' ? ' is-today' : '');

        const timeTop = document.createElement('div');
        timeTop.className = 'chart-time-val';
        timeTop.textContent = item.formatted;

        const track = document.createElement('div');
        track.className = 'd1-segments-track';

        const totalSegments = 16;
        const litSegments = Math.max(2, Math.round((item.minutes / maxMinutes) * totalSegments));

        for (let s = 0; s < totalSegments; s++) {
          const seg = document.createElement('div');
          seg.className = 'd1-segment';
          if (s < litSegments) {
            seg.classList.add(s === litSegments - 1 ? 'lit-peak' : 'lit');
          }
          track.appendChild(seg);
        }

        const dayBottom = document.createElement('div');
        dayBottom.className = 'chart-day-label';
        dayBottom.textContent = item.label;

        col.appendChild(timeTop);
        col.appendChild(track);
        col.appendChild(dayBottom);
        chart.appendChild(col);
      });

      parent.appendChild(chart);
    }

    // CONCEPT 2: Quantum Pulse Waveform
    function renderConcept2(parent) {
      const chart = document.createElement('div');
      chart.className = 'd2-chart';

      const svgWrap = document.createElement('div');
      svgWrap.className = 'd2-svg-wrap';

      const points = activeTelemetryData.map((d, i) => {
        const x = (i / (activeTelemetryData.length - 1)) * 500;
        const y = 140 - ((d.minutes / maxMinutes) * 110);
        return { x, y, ...d };
      });

      let pathD = `M ${points[0].x} ${points[0].y}`;
      for (let i = 0; i < points.length - 1; i++) {
        const xc = (points[i].x + points[i + 1].x) / 2;
        const yc = (points[i].y + points[i + 1].y) / 2;
        pathD += ` Q ${points[i].x} ${points[i].y}, ${xc} ${yc}`;
      }
      pathD += ` T ${points[points.length - 1].x} ${points[points.length - 1].y}`;

      const areaD = `${pathD} L ${points[points.length - 1].x} 150 L 0 150 Z`;

      svgWrap.innerHTML = `
        <svg viewBox="0 0 500 160" width="100%" height="100%" preserveAspectRatio="none">
          <defs>
            <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <path d="${areaD}" fill="url(#waveGrad)"/>
          <path d="${pathD}" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
          ${points.map((p, idx) => `
            <circle cx="${p.x}" cy="${p.y}" r="${p.label === 'Today' ? 5 : 3.5}" fill="${p.label === 'Today' ? '#ffffff' : '#00f0ff'}" />
            <text x="${p.x}" y="${p.y - 10}" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">${p.formatted}</text>
          `).join('')}
        </svg>
      `;

      const labelsRow = document.createElement('div');
      labelsRow.className = 'd2-labels-row';
      activeTelemetryData.forEach(d => {
        const lbl = document.createElement('div');
        lbl.className = 'd2-day-label' + (d.label === 'Today' ? ' is-today' : '');
        lbl.textContent = d.label;
        labelsRow.appendChild(lbl);
      });

      chart.appendChild(svgWrap);
      chart.appendChild(labelsRow);
      parent.appendChild(chart);
    }

    // CONCEPT 3: Rounded Glass Micro-Pills
    function renderConcept3(parent) {
      const chart = document.createElement('div');
      chart.className = 'd3-chart';

      activeTelemetryData.forEach(item => {
        const col = document.createElement('div');
        col.className = 'd3-column' + (item.label === 'Today' ? ' is-today' : '');

        const timeTop = document.createElement('div');
        timeTop.className = 'chart-time-val';
        timeTop.textContent = item.formatted;

        const outer = document.createElement('div');
        outer.className = 'd3-pill-outer';

        const fill = document.createElement('div');
        fill.className = 'd3-pill-fill';
        const heightPct = Math.max(12, Math.round((item.minutes / maxMinutes) * 100));
        fill.style.height = `${heightPct}%`;

        outer.appendChild(fill);

        const dayBottom = document.createElement('div');
        dayBottom.className = 'chart-day-label';
        dayBottom.textContent = item.label;

        col.appendChild(timeTop);
        col.appendChild(outer);
        col.appendChild(dayBottom);
        chart.appendChild(col);
      });

      parent.appendChild(chart);
    }

    // CONCEPT 4: Adaptive Horizontal Rails (Phone) & Desktop Stems
    function renderConcept4(parent) {
      if (currentDevice === 'phone') {
        const chart = document.createElement('div');
        chart.className = 'd4-phone-chart';

        activeTelemetryData.forEach(item => {
          const row = document.createElement('div');
          row.className = 'd4-rail-row' + (item.label === 'Today' ? ' is-today' : '');

          const day = document.createElement('div');
          day.className = 'd4-rail-day' + (item.label === 'Today' ? ' is-today' : '');
          day.textContent = item.label;

          const track = document.createElement('div');
          track.className = 'd4-rail-bar-track';

          const fill = document.createElement('div');
          fill.className = 'd4-rail-fill';
          const widthPct = Math.max(12, Math.round((item.minutes / maxMinutes) * 100));
          fill.style.width = `${widthPct}%`;
          track.appendChild(fill);

          const time = document.createElement('div');
          time.className = 'd4-rail-time';
          time.textContent = item.formatted;

          row.appendChild(day);
          row.appendChild(track);
          row.appendChild(time);
          chart.appendChild(row);
        });

        parent.appendChild(chart);
      } else {
        renderConcept3(parent);
      }
    }

    let screenActive = false;
    function toggleScreen() {
      screenActive = !screenActive;
      document.getElementById('screenSwitch').classList.toggle('active', screenActive);
    }

    // Initialize
    renderCurrentConcept();
  </script>
</body>
</html>

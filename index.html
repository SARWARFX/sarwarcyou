<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#030305" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SARWARCYOU" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Robots: No Indexing -->
    <title>SARWARCYOU</title>
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fonts: Roboto Condensed & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Global Root Overflow Lock & Roboto Condensed Typography -->
    <style>
      html, body {
        width: 100%;
        max-width: 100%;
        height: 100dvh;
        overflow: hidden;
        position: relative;
        touch-action: pan-x;
        font-family: 'Roboto Condensed', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #root {
        width: 100%;
        max-width: 100%;
        height: 100dvh;
        overflow: hidden;
        touch-action: pan-x;
        font-family: 'Roboto Condensed', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      /* Cyber Lens Aperture & HUD Animation */
      .cyber-splash-active {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #020617;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        user-select: none;
        -webkit-user-select: none;
      }

      .cyber-splash-active.dismissed {
        opacity: 0;
        transform: scale(1.08);
        pointer-events: none;
      }

      .aperture-backdrop-grid {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(rgba(56, 189, 248, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
        background-size: 36px 36px;
        pointer-events: none;
      }

      .hud-corner {
        position: absolute;
        width: 32px;
        height: 32px;
        border: 2px solid rgba(56, 189, 248, 0.5);
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      }
      .top-left { top: 28px; left: 28px; border-right: none; border-bottom: none; }
      .top-right { top: 28px; right: 28px; border-left: none; border-bottom: none; }
      .bottom-left { bottom: 28px; left: 28px; border-right: none; border-top: none; }
      .bottom-right { bottom: 28px; right: 28px; border-left: none; border-top: none; }

      .aperture-assembly {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        z-index: 2;
      }

      .telemetry-tag {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        color: rgba(56, 189, 248, 0.7);
        letter-spacing: 2px;
        text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
      }
      .top-tag { margin-bottom: 24px; }
      .bottom-tag { margin-top: 24px; font-size: 10px; opacity: 0.6; }

      .lens-chassis {
        position: relative;
        width: 200px;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .ring-track.outer-spin {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px dashed rgba(56, 189, 248, 0.4);
        animation: chassisSpin 12s linear infinite;
      }

      .ring-track.inner-counter-spin {
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        border: 2px dotted rgba(56, 189, 248, 0.6);
        box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.2);
        animation: chassisSpinReverse 8s linear infinite;
      }

      .iris-chamber {
        position: absolute;
        inset: 26px;
        border-radius: 50%;
        background: #030712;
        overflow: hidden;
        border: 2px solid rgba(56, 189, 248, 0.5);
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.35), inset 0 0 30px rgba(0, 0, 0, 0.9);
      }

      .iris-blade {
        position: absolute;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #090e1a 0%, #172554 100%);
        border: 1px solid rgba(56, 189, 248, 0.35);
        transform-origin: 50% 50%;
        transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .blade-1 { transform: rotate(0deg) translate(0%, -28%); }
      .blade-2 { transform: rotate(60deg) translate(0%, -28%); }
      .blade-3 { transform: rotate(120deg) translate(0%, -28%); }
      .blade-4 { transform: rotate(180deg) translate(0%, -28%); }
      .blade-5 { transform: rotate(240deg) translate(0%, -28%); }
      .blade-6 { transform: rotate(300deg) translate(0%, -28%); }

      .lens-flare-beam {
        position: absolute;
        width: 320px;
        height: 3px;
        background: linear-gradient(90deg, transparent, #38bdf8, #ffffff, #38bdf8, transparent);
        filter: drop-shadow(0 0 12px #38bdf8);
        animation: flareSweep 2.5s ease-in-out infinite alternate;
        z-index: 4;
      }

      .central-optic-core {
        position: relative;
        z-index: 5;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(10px);
        border: 1.5px solid rgba(56, 189, 248, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.5), inset 0 0 10px rgba(56, 189, 248, 0.3);
      }

      .optic-play-symbol {
        width: 38px;
        height: 38px;
        filter: drop-shadow(0 0 10px #38bdf8);
      }

      .aperture-readout {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 28px;
      }

      .brand-logotype {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 7px;
        color: #f8fafc;
        text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      }

      .sub-telemetry {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        color: #94a3b8;
        letter-spacing: 2px;
        margin-top: 8px;
      }

      .blinking-indicator {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #38bdf8;
        box-shadow: 0 0 10px #38bdf8;
        animation: blinkDot 0.8s infinite alternate;
      }

      .progress-bar-slot {
        width: 160px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        margin-top: 20px;
        overflow: hidden;
      }

      .progress-bar-fill {
        width: 0%;
        height: 100%;
        background: #38bdf8;
        box-shadow: 0 0 12px #38bdf8;
        animation: loadProgressBar 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      @keyframes chassisSpin { to { transform: rotate(360deg); } }
      @keyframes chassisSpinReverse { to { transform: rotate(-360deg); } }
      @keyframes blinkDot { from { opacity: 0.2; } to { opacity: 1; } }
      @keyframes flareSweep {
        0% { transform: scaleX(0.2); opacity: 0.3; }
        50% { transform: scaleX(1.4); opacity: 1; filter: drop-shadow(0 0 16px #38bdf8); }
        100% { transform: scaleX(0.8); opacity: 0.7; }
      }
      @keyframes loadProgressBar { 0% { width: 0%; } 100% { width: 100%; } }
    </style>
  </head>
  <body class="bg-[#08090c] text-neutral-100 antialiased overflow-x-hidden relative max-w-full select-none selection:bg-neutral-700 selection:text-white font-sans" style="font-family: 'Roboto Condensed', sans-serif;">
    <div id="cyber-splash-screen" class="cyber-splash-active">
      <div class="aperture-backdrop-grid"></div>
      
      <!-- HUD Viewfinder Corners -->
      <div class="hud-corner top-left"></div>
      <div class="hud-corner top-right"></div>
      <div class="hud-corner bottom-left"></div>
      <div class="hud-corner bottom-right"></div>

      <div class="aperture-assembly">
        <div class="telemetry-tag top-tag">SYS.BOOT // APERTURE CALIBRATION [2.5s]</div>

        <!-- Mechanical Lens Housing -->
        <div class="lens-chassis">
          <div class="ring-track outer-spin"></div>
          <div class="ring-track inner-counter-spin"></div>
          
          <!-- 6 Overlapping Iris Aperture Blades -->
          <div class="iris-chamber">
            <div class="iris-blade blade-1"></div>
            <div class="iris-blade blade-2"></div>
            <div class="iris-blade blade-3"></div>
            <div class="iris-blade blade-4"></div>
            <div class="iris-blade blade-5"></div>
            <div class="iris-blade blade-6"></div>
          </div>

          <!-- Laser Beam & Flare -->
          <div class="lens-flare-beam"></div>

          <!-- Central Glass Lens Core -->
          <div class="central-optic-core">
            <div class="optic-glass-sheen"></div>
            <svg viewBox="0 0 100 100" class="optic-play-symbol">
              <polygon points="38,28 76,50 38,72" fill="#38bdf8" />
            </svg>
          </div>
        </div>

        <!-- Branding & Progress -->
        <div class="aperture-readout">
          <div class="brand-logotype">SARWARCYOU</div>
          <div class="sub-telemetry">
            <span class="blinking-indicator"></span>
            <span>QUANTUM OPTICAL VAULT // ONLINE</span>
          </div>
          <div class="progress-bar-slot">
            <div class="progress-bar-fill"></div>
          </div>
        </div>

        <div class="telemetry-tag bottom-tag">OPTICAL RESOLUTION: 4K DIRECT // INITIALIZED</div>
      </div>
    </div>

    <script>
      (function initCyberSplash() {
        function dismiss() {
          const splash = document.getElementById('cyber-splash-screen');
          if (!splash || splash.classList.contains('dismissed')) return;
          setTimeout(() => {
            splash.classList.add('dismissed');
            setTimeout(() => {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, 700);
          }, 2500);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', dismiss);
        } else {
          dismiss();
        }
      })();
    </script>

    <script>
      window.BRAND_CONFIG = {
        name: 'SARWARCYOU',
        logoSrc: '/SARWARCYOU.svg',
        sourceUrl: 'https://www.sarwar.cyou/'
      };
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

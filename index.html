<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#030305" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SARWARCYOU" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Robots: No Indexing -->
    <title>SARWARCYOU</title>
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fonts: Roboto Condensed & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Global Root Overflow Lock & Roboto Condensed Typography -->
    <style>
      html, body {
        width: 100%;
        max-width: 100%;
        height: 100dvh;
        overflow: hidden;
        position: relative;
        touch-action: pan-x;
        font-family: 'Roboto Condensed', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #root {
        width: 100%;
        max-width: 100%;
        height: 100dvh;
        overflow: hidden;
        touch-action: pan-x;
        font-family: 'Roboto Condensed', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      /* Cyber Lens Aperture & HUD Startup Animation */
      .cyber-splash-root {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #020617;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        pointer-events: all;
        user-select: none;
        -webkit-user-select: none;
        transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .cyber-splash-root.dismissed {
        opacity: 0;
        transform: scale(1.06);
        pointer-events: none;
      }
      .hud-grid-overlay {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
        background-size: 32px 32px;
        pointer-events: none;
      }
      .hud-bracket {
        position: absolute;
        width: 24px;
        height: 24px;
        border: 2px solid rgba(56, 189, 248, 0.4);
        pointer-events: none;
      }
      .hud-top-left { top: 24px; left: 24px; border-right: none; border-bottom: none; }
      .hud-top-right { top: 24px; right: 24px; border-left: none; border-bottom: none; }
      .hud-bottom-left { bottom: 24px; left: 24px; border-right: none; border-top: none; }
      .hud-bottom-right { bottom: 24px; right: 24px; border-left: none; border-top: none; }

      .lens-aperture-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
      }
      .hud-telemetry-text {
        font-family: 'Roboto Condensed', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        color: rgba(56, 189, 248, 0.6);
        letter-spacing: 2px;
      }
      .top-telemetry { margin-bottom: 24px; }
      .bottom-telemetry { margin-top: 24px; opacity: 0.7; }

      .aperture-core {
        position: relative;
        width: 160px;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .aperture-ring-outer {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px dashed rgba(56, 189, 248, 0.35);
        animation: spinRing 12s linear infinite;
      }
      .aperture-ring-ticks {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        border: 2px dotted rgba(56, 189, 248, 0.5);
        animation: spinRingReverse 8s linear infinite;
      }
      .aperture-blade-iris {
        position: absolute;
        inset: 22px;
        border-radius: 50%;
        overflow: hidden;
        border: 1px solid rgba(56, 189, 248, 0.4);
        background: rgba(3, 7, 18, 0.85);
        box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.25);
      }
      .lens-flare-beam {
        position: absolute;
        width: 220px;
        height: 2px;
        background: linear-gradient(90deg, transparent, #38bdf8, #ffffff, #38bdf8, transparent);
        box-shadow: 0 0 16px #38bdf8;
        animation: flareSweep 2.5s ease-in-out forwards;
        opacity: 0.8;
      }
      .aperture-center-logo {
        position: relative;
        z-index: 3;
        width: 58px;
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(56, 189, 248, 0.4);
        box-shadow: 0 0 24px rgba(56, 189, 248, 0.4);
      }
      .hud-logo-svg {
        width: 32px;
        height: 32px;
        filter: drop-shadow(0 0 8px #38bdf8);
      }

      .hud-identity {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 24px;
      }
      .hud-title {
        margin: 0;
        color: #f8fafc;
        font-family: 'Roboto Condensed', system-ui, -apple-system, sans-serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 6px;
        text-shadow: 0 0 16px rgba(56, 189, 248, 0.45);
      }
      .hud-status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #38bdf8;
        box-shadow: 0 0 8px #38bdf8;
        animation: blinkDot 1s infinite alternate;
      }
      .status-readout {
        font-family: 'Roboto Condensed', ui-monospace, SFMono-Regular, monospace;
        font-size: 10px;
        color: #94a3b8;
        letter-spacing: 2px;
      }
      .hud-progress-track {
        width: 140px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        margin-top: 18px;
        overflow: hidden;
      }
      .hud-progress-fill {
        width: 0%;
        height: 100%;
        background: #38bdf8;
        box-shadow: 0 0 10px #38bdf8;
        animation: fillProgress 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      @keyframes spinRing { to { transform: rotate(360deg); } }
      @keyframes spinRingReverse { to { transform: rotate(-360deg); } }
      @keyframes blinkDot { from { opacity: 0.3; } to { opacity: 1; } }
      @keyframes flareSweep {
        0% { transform: scaleX(0.2); opacity: 0.2; }
        50% { transform: scaleX(1.4); opacity: 1; }
        100% { transform: scaleX(0.9); opacity: 0.7; }
      }
      @keyframes fillProgress {
        0% { width: 0%; }
        100% { width: 100%; }
      }
    </style>
  </head>
  <body class="bg-[#08090c] text-neutral-100 antialiased overflow-x-hidden relative max-w-full select-none selection:bg-neutral-700 selection:text-white font-sans" style="font-family: 'Roboto Condensed', sans-serif;">
    <div id="cyber-splash-screen" class="cyber-splash-root" aria-hidden="true">
      <div class="hud-grid-overlay"></div>
      <div class="hud-bracket hud-top-left"></div>
      <div class="hud-bracket hud-top-right"></div>
      <div class="hud-bracket hud-bottom-left"></div>
      <div class="hud-bracket hud-bottom-right"></div>

      <div class="lens-aperture-stage">
        <div class="hud-telemetry-text top-telemetry">SYS.DIAG // APERTURE ACTIVE</div>
        <div class="aperture-core">
          <div class="aperture-ring-outer"></div>
          <div class="aperture-ring-ticks"></div>
          <div class="aperture-blade-iris"></div>
          <div class="lens-flare-beam"></div>
          <div class="aperture-center-logo">
            <svg class="hud-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="35,22 80,50 35,78" fill="url(#cyan-glow)" />
              <defs>
                <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#0284c7" />
                  <stop offset="100%" stop-color="#38bdf8" />
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>
        <div class="hud-telemetry-text bottom-telemetry">OPTICAL RESOLUTION 4K // READY</div>
      </div>

      <div class="hud-identity">
        <h1 class="hud-title">SARWARCYOU</h1>
        <div class="hud-status">
          <span class="status-dot"></span>
          <span class="status-readout">QUANTUM MEDIA VAULT // SECURE INITIALIZATION</span>
        </div>
        <div class="hud-progress-track">
          <div class="hud-progress-fill"></div>
        </div>
      </div>
    </div>

    <script>
      (function initCyberSplash() {
        function dismiss() {
          const splash = document.getElementById('cyber-splash-screen');
          if (!splash || splash.classList.contains('dismissed')) return;
          setTimeout(() => {
            splash.classList.add('dismissed');
            setTimeout(() => {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, 700);
          }, 2500);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', dismiss);
        } else {
          dismiss();
        }
      })();
    </script>

    <script>
      window.BRAND_CONFIG = {
        name: 'SARWARCYOU',
        logoSrc: '/SARWARCYOU.svg',
        sourceUrl: 'https://www.sarwar.cyou/'
      };
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

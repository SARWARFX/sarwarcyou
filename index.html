<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#030305" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SARWARCYOU" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Robots: No Indexing -->
    <title>SARWARCYOU</title>
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fonts: Roboto Condensed & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Global Root Overflow Lock & Roboto Condensed Typography -->
    <style>
      html, body {
        width: 100%;
        max-width: 100%;
        height: 100dvh;
        overflow: hidden;
        position: relative;
        touch-action: pan-x;
        font-family: 'Roboto Condensed', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #root {
        width: 100%;
        max-width: 100%;
        height: 100dvh;
        overflow: hidden;
        touch-action: pan-x;
        font-family: 'Roboto Condensed', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      /* Quantum Pulse & Trace Startup Splash Animation */
      .splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #030712;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        user-select: none;
        -webkit-user-select: none;
      }
      .splash-screen.fade-out {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      .splash-core {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
      }
      .splash-glow {
        position: absolute;
        top: 40px;
        width: 140px;
        height: 140px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.45) 0%, rgba(3, 7, 18, 0) 70%);
        border-radius: 50%;
        animation: pulseGlow 1.4s ease-in-out infinite alternate;
      }
      .splash-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px dashed rgba(56, 189, 248, 0.3);
      }
      .splash-ring-outer {
        width: 150px;
        height: 150px;
        top: 35px;
        animation: rotateRight 10s linear infinite;
      }
      .splash-ring-inner {
        width: 120px;
        height: 120px;
        top: 50px;
        border-style: dotted;
        border-color: rgba(56, 189, 248, 0.45);
        animation: rotateLeft 7s linear infinite;
      }
      .splash-logo-svg {
        width: 90px;
        height: 90px;
        filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.7));
        margin-bottom: 24px;
      }
      .trace-triangle {
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        animation: traceStroke 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .fill-triangle {
        opacity: 0;
        animation: fillFade 0.6s ease 0.6s forwards;
      }
      .splash-title {
        color: #f8fafc;
        font-family: 'Roboto Condensed', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 5px;
        margin: 0;
        text-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
      }
      .splash-tagline {
        color: #38bdf8;
        font-family: 'Roboto Condensed', monospace;
        font-size: 9px;
        letter-spacing: 3px;
        margin-top: 6px;
        opacity: 0.85;
      }
      .splash-loader-bar {
        width: 110px;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        margin-top: 20px;
        overflow: hidden;
      }
      .splash-loader-progress {
        width: 0%;
        height: 100%;
        background: #38bdf8;
        box-shadow: 0 0 8px #38bdf8;
        animation: loadProgress 1.3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      @keyframes traceStroke { to { stroke-dashoffset: 0; } }
      @keyframes fillFade { to { opacity: 1; } }
      @keyframes pulseGlow {
        0% { transform: scale(0.85); opacity: 0.3; }
        100% { transform: scale(1.15); opacity: 0.75; }
      }
      @keyframes rotateRight { to { transform: rotate(360deg); } }
      @keyframes rotateLeft { to { transform: rotate(-360deg); } }
      @keyframes loadProgress { 0% { width: 0%; } 100% { width: 100%; } }
    </style>
  </head>
  <body class="bg-[#08090c] text-neutral-100 antialiased overflow-x-hidden relative max-w-full select-none selection:bg-neutral-700 selection:text-white font-sans" style="font-family: 'Roboto Condensed', sans-serif;">
    <div id="app-splash-screen" class="splash-screen">
      <div class="splash-particles" id="splash-particles"></div>
      <div class="splash-core">
        <div class="splash-glow"></div>
        <div class="splash-ring splash-ring-outer"></div>
        <div class="splash-ring splash-ring-inner"></div>
        <svg class="splash-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon class="trace-triangle" points="35,22 80,50 35,78" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <polygon class="fill-triangle" points="35,22 80,50 35,78" fill="url(#blue-gradient)" />
          <defs>
            <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0284c7" />
              <stop offset="100%" stop-color="#38bdf8" />
            </linearGradient>
          </defs>
        </svg>
        <h1 class="splash-title">SARWARCYOU</h1>
        <p class="splash-tagline">QUANTUM MEDIA VAULT</p>
        <div class="splash-loader-bar"><div class="splash-loader-progress"></div></div>
      </div>
    </div>

    <script>
      window.BRAND_CONFIG = {
        name: 'SARWARCYOU',
        logoSrc: '/SARWARCYOU.svg',
        sourceUrl: 'https://www.sarwar.cyou/'
      };
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
